server:
  port: 8081

spring:
  application:
    name: publicaciones-service
  # En Spring Boot 4 la propiedad es spring.mongodb.uri
  # (spring.data.mongodb.uri se ignora y la app usaria la base "test").
  mongodb:
    uri: mongodb://localhost:27017/rica

  grpc:
    client:
      channel:
        investigadores:
          target: static://localhost:9090

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: publicaciones-service
      auto-offset-reset: earliest

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    # Cada linea de log lleva el servicio y el id de correlacion de la peticion
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
